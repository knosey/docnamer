[test]
preload = ["./tests/preload.ts"]

[fmt]
printWidth = 100
tabWidth = 2
useTabs = false
semi = false
singleQuote = false
quoteProps = "as-needed"
jsxSingleQuote = false
trailingComma = "none"
bracketSpacing = true
bracketSameLine = true
arrowParens = "avoid"
endOfLine = "lf"
singleAttributePerLine = false
