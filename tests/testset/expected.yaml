# The truth evalTestset scores against: for every graded file in this folder,
# the type it should be classified as, the fields it should extract, and the
# full new name Stage 4 should render. Eval observes — it renames nothing.
#
# These files are REAL COPIES of tests/fixtures/*, never symlinks: Bun.Glob
# does not report a symlink (verified), so a symlinked test set scores as empty.
# Keep the two folders in step — the reference `ls tests/fixtures` in
# tests/eval.test.ts asserts this set is exactly that one.
#
# A field listed here is scored; a field omitted is not. `last4` is omitted from
# both statements because neither fixture prints an account number, and a
# missing required field is flagged by Stage 3 rather than invented by it.
acme-statement-scan.pdf:
  type: bank_statement
  fields:
    date: "2024-03-12"
    bank: Acme Services
  name: 2024-03-12 Acme Services statement.pdf
dup-invoice-2.md:
  type: invoice
  fields:
